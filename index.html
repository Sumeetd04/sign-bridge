<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fbf9f6" />
    <title>SignBridge — A little practice. A world of connection.</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <aside class="sidebar" id="sidebar">
      <a href="#home" class="brand"
        ><span class="brand-icon">↔</span> SignBridge<span class="brand-dot"
          >.</span
        ></a
      >
      <div class="workspace-label">YOUR LEARNING SPACE</div>
      <nav aria-label="Main navigation" id="navigation"></nav>
      <div class="sidebar-bottom">
        <div class="small-hands">✦ <span><img class="emoji" src="/assets/emoji/1f91f.svg" alt=""></span> ✦</div>
        <h3>Small signs.<br />Big connections.</h3>
        <p>Your next conversation<br />starts with one sign.</p>
        <button class="button dark" data-route="learn">
          Explore lessons <span>↗</span>
        </button>
      </div>
      <a class="sidebar-help" href="#about"
        ><span>ⓘ</span> About SignBridge <span>↗</span></a
      >
    </aside>
    <div class="app-shell">
      <header class="topbar">
        <div class="top-left">
          <button
            class="icon-button mobile-menu"
            id="menu-toggle"
            aria-label="Toggle navigation"
          >
            ☰</button
          ><span class="breadcrumb">Your space to connect <span>✦</span></span>
        </div>
        <div class="top-actions">
          <span class="asl-label"><i></i> American Sign Language</span
          ><button
            class="icon-button"
            id="help-button"
            aria-label="About SignBridge"
          >
            ?</button
          ><button
            class="profile-button"
            id="profile-button"
            aria-label="Open account"
          >
            S
          </button>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
      <footer>
        <span>Made for a more connected world.</span
        ><span>One sign at a time <span class="coral">♡</span></span>
      </footer>
    </div>
    <dialog id="modal"><div id="modal-content"></div></dialog>
    <div class="toast" id="toast" role="status"></div>
  </body>
</html>
